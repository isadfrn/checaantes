info:
  name: change-password
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/users/me/password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "currentPassword": "123456789",
        "password": "novaSenhaForte123",
        "passwordConfirmation": "novaSenhaForte123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Troca a senha do usuário logado. Exige a senha atual (currentPassword) — retorna 401 se estiver errada. password e passwordConfirmation precisam ser iguais.
