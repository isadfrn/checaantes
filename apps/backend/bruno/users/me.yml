info:
  name: me
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retorna o perfil do usuário logado (sem dados sensíveis como hash de senha), incluindo a profissão associada.
