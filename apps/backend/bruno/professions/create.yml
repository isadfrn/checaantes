info:
  name: create
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/professions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "name": "Odontologia",
        "federalCouncil": "CFO",
        "regionalCouncils": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Exige token de um usuário com role=admin. Retorna 401 sem token, 403 se o token for de um usuário comum.
