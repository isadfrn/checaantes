info:
  name: update
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/professions/{{professionId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "regionalCouncils": ["CRMV-SC", "CRMV-SP"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

