info:
  name: forgot-password
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "franfreitasfoto@gmail.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Envia um código de 6 dígitos por e-mail (capturado pelo Maildev em http://localhost:1080) para redefinir a senha. Resposta sempre genérica, exista a conta ou não. Copie o código para a variável `resetCode` e use na request "reset-password". O código expira em 15 minutos e é de uso único.
