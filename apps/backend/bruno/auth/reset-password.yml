info:
  name: reset-password
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "franfreitasfoto@gmail.com",
        "code": "{{resetCode}}",
        "password": "novaSenhaForte123",
        "passwordConfirmation": "novaSenhaForte123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Redefine a senha usando o código recebido por e-mail (variável `resetCode`). password e passwordConfirmation precisam ser iguais. Código inválido/expirado retorna 400.
