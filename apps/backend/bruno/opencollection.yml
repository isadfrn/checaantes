docs:
  content: |-
    Coleção com todas as rotas implementadas até a Parte 2 do backend: autenticação (JWT) e CRUD de profissões, protegido por papel (admin/user).

    Como usar:
    1. Rode `POST /auth/login` com o admin criado pelo seed (ou `POST /auth/register` para um usuário comum).
    2. Copie o `accessToken` da resposta e cole na variável de coleção `accessToken` (aba Variables da coleção, no Bruno).
    3. As rotas protegidas (criar/editar/remover profissão) já usam `{{accessToken}}` automaticamente no header Authorization.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
