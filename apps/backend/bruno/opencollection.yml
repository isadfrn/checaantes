docs:
  content: |-
    Coleção com as rotas do backend até a Parte 3: autenticação (JWT) com confirmação de e-mail, CRUD de profissões protegido por papel (admin/user) e cadastro com nome/telefone/estado.

    Fluxo de cadastro (Parte 3):
    1. Rode `POST /auth/register` (só "SC" é aceito enquanto a flag do Unleash "cadastro-nacional-liberado" estiver off).
    2. O e-mail de confirmação é capturado pelo Maildev em http://localhost:1080. Copie o token do link e cole na variável `confirmToken`.
    3. Rode `GET /auth/confirm` — a conta passa a poder logar.
    4. `POST /auth/login` só funciona depois de confirmado; antes disso retorna 403.

    Rotas protegidas de profissões:
    1. Rode `POST /auth/login` com o admin criado pelo seed.
    2. Copie o `accessToken` da resposta para a variável de coleção `accessToken`.
    3. As rotas de criar/editar/remover profissão já usam `{{accessToken}}` no header Authorization.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
