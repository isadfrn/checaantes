services:
  db:
    image: postgres:16
    container_name: checaantes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: checaantes
      POSTGRES_PASSWORD: checaantes
      POSTGRES_DB: checaantes_dev
    ports:
      - "5432:5432"
    volumes:
      - checaantes_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checaantes -d checaantes_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: checaantes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - checaantes_redis_data:/data

  maildev:
    image: maildev/maildev:latest
    container_name: checaantes-maildev
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025"

  unleash-db:
    image: postgres:16
    container_name: checaantes-unleash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
      POSTGRES_DB: unleash
    volumes:
      - checaantes_unleash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10

  unleash:
    image: unleashorg/unleash-server:latest
    container_name: checaantes-unleash
    restart: unless-stopped
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgres://unleash:unleash@unleash-db:5432/unleash
      DATABASE_SSL: "false"
    depends_on:
      unleash-db:
        condition: service_healthy

volumes:
  checaantes_db_data:
  checaantes_redis_data:
  checaantes_unleash_db_data:
